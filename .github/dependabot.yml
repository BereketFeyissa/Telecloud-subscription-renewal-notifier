# Actions are referenced by major-version tag, which is mutable. Dependabot is what keeps
# them honest; without it, pinning by tag quietly rots.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "ci"

  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "build"

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "build"
    ignore:
      # The interpreter version is pinned in CLAUDE.md §4 and in requires-python. Moving it is
      # a deliberate decision, not a dependency bump, so only security and digest refreshes of
      # the 3.12 line are wanted here.
      - dependency-name: python
        update-types:
          - version-update:semver-major
          - version-update:semver-minor
