apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: tele-scraper
namePrefix: prod-

resources:
  - ../../base

images:
  - name: tele-scraper
    newName: ghcr.io/bereketfeyissa/telecloud-subscription-renewal-notifier
    # The full git SHA published by release.yml. Deploy the SHA, not the version
    # tag: a tag can be moved, a SHA cannot. Never :latest (CLAUDE.md §13.7).
    newTag: REPLACE_WITH_RELEASED_SHA

# The only environment that actually delivers notifications.
configMapGenerator:
  - name: tele-scraper-config
    behavior: merge
    literals:
      - NOTIFY_ENABLED=true
      - DRY_RUN=false
      - LOG_LEVEL=INFO
      - RUN_INTERVAL_SECONDS=3600
      - PORTAL_BASE_URL=https://portal.example.test
