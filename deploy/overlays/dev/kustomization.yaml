apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: tele-scraper-dev
namePrefix: dev-

resources:
  - ../../base

images:
  - name: tele-scraper
    newName: ghcr.io/bereketfeyissa/telecloud-subscription-renewal-notifier
    # The full git SHA published by release.yml. Deploy the SHA, not the version
    # tag: a tag can be moved, a SHA cannot. Never :latest (CLAUDE.md §13.7).
    newTag: REPLACE_WITH_RELEASED_SHA

# Dev never sends. Flip NOTIFY_ENABLED only in prod.
configMapGenerator:
  - name: tele-scraper-config
    behavior: merge
    literals:
      - NOTIFY_ENABLED=false
      - DRY_RUN=true
      - LOG_LEVEL=DEBUG
      - RUN_INTERVAL_SECONDS=900
      - PORTAL_BASE_URL=https://portal-staging.example.test

patches:
  - target:
      kind: Deployment
      name: tele-scraper
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/memory
        value: 256Mi
