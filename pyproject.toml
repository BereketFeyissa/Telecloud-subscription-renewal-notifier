[project]
name = "tele-scraper"
version = "0.1.0"
description = "Scrapes telecloud component validity and notifies recipients across multiple channels."
requires-python = ">=3.12,<3.13"
dependencies = [
    "pydantic>=2.9,<3",
    "pydantic-settings>=2.5,<3",
    "httpx>=0.27,<0.29",
    "tenacity>=9.0,<10",
    "structlog>=24.4,<26",
    "prometheus-client>=0.21,<0.24",
    "jinja2>=3.1,<4",
]

[project.scripts]
tele-scraper = "tele_scraper.__main__:main"

[dependency-groups]
dev = [
    "pytest>=8.3,<9",
    "pytest-asyncio>=0.24,<2",
    "pytest-cov>=5.0,<7",
    "respx>=0.21,<0.23",
    "freezegun>=1.5,<2",
    "ruff>=0.7,<0.16",
    "mypy>=1.13,<2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tele_scraper"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "C4", "DTZ", "T20", "SIM", "PTH", "RUF", "ASYNC", "S", "BLE"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "S108"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
disallow_any_unimported = true
plugins = ["pydantic.mypy"]
mypy_path = "src"
packages = ["tele_scraper"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
addopts = "-q --strict-markers -m 'not live'"
markers = ["live: hits the real portal; excluded by default, never runs in CI"]

[tool.coverage.run]
source = ["src/tele_scraper"]
branch = true

[tool.coverage.report]
fail_under = 85
show_missing = true
# Only a bare ellipsis STATEMENT (a Protocol stub body) is excluded. A loose "\\.\\.\\."
# also matches `tuple[timedelta, ...]` in a signature and silently drops the whole
# function from measurement.
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "^\\s*\\.\\.\\.$",
]
